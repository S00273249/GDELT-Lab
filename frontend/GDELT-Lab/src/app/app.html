
<div class="app-shell">
  <header class="app-header">
    <a class="brand" routerLink="/">
      <span class="brand-mark">G</span>
      <span>
        <strong>GDELT-Lab</strong>
        <small>Global news research environment</small>
      </span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        Overview
      </a>

      <a routerLink="/datasets" routerLinkActive="active">
        Dataset Explorer
      </a>

      <a routerLink="/research" routerLinkActive="active">
        Research Results
      </a>

      <a routerLink="/about" routerLinkActive="active">
        About
      </a>
    </nav>
  </header>

  <main class="app-content">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <span>GDELT-Lab</span>
    <span>Research prototype</span>
  </footer>
</div>
