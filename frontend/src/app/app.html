<main class="dashboard">
  <h1>{{ title() }}</h1>
  <p>Global News &amp; Public Affairs Intelligence Platform</p>

  <section class="status-panel">
    <h2>Backend connection</h2>

    @if (loading()) {
      <p>Connecting to the ASP.NET Core API...</p>
    } @else if (health(); as response) {
      <p class="success">✓ {{ response.message }}</p>
      <p>Status: {{ response.status }}</p>
    } @else {
      <p class="error">{{ error() }}</p>
    }
  </section>
</main>

<router-outlet />
